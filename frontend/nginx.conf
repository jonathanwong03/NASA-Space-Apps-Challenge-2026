server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/event-stream image/svg+xml;

  # API gateway: route /api/<service>/ to each microservice
  location /api/catalog/ {
    proxy_pass http://catalog:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api/insights/ {
    proxy_pass http://insights:8000/;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_buffering off;          # stream SI answers (SSE)
    proxy_cache off;
    proxy_read_timeout 300s;
  }
  location /api/ingest/ {
    proxy_pass http://ingestion:8000/;
    proxy_set_header Host $host;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
  location / {
    try_files $uri /index.html;
  }
}
